<style>
  :root {
    --bg: #171716;
    --ink-faint: #8C8A86;
    --border: rgba(255,255,255,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #FFFFFF;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); }

  /* ---------- header (same component as the rest of the site) ---------- */
  .site-header {
    --nav-fg: rgba(255,255,255,0.78);
    --nav-fg-strong: #FFFFFF;
    --nav-scrim: 13,13,12;
    --nav-solid: rgba(13,13,12,0.92);
    --nav-border: rgba(255,255,255,0.10);
    position: sticky;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 20px clamp(20px, 5vw, 64px);
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--nav-border);
  }
  .site-logo { display: flex; align-items: center; }
  .logo-mark { width: 26px; height: 26px; fill: none; stroke: var(--nav-fg-strong); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .site-tabs { display: flex; align-items: center; gap: clamp(16px, 2.6vw, 30px); font-size: 13.5px; font-weight: 500; }
  .site-tabs a { color: var(--nav-fg); transition: color 0.2s var(--ease); white-space: nowrap; }
  .site-tabs a:hover, .site-tabs a.active { color: var(--nav-fg-strong); }
  @media (max-width: 860px) {
    .site-tabs { position: fixed; inset: 64px 0 0 0; background: #0D0D0C; flex-direction: column;
      justify-content: flex-start; align-items: flex-start; padding: 32px 24px; gap: 20px; font-size: 17px;
      transform: translateY(-8px); opacity: 0; pointer-events: none; transition: opacity 0.25s var(--ease), transform 0.25s var(--ease); }
    .site-tabs.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  }
  .site-tabs-toggle { display: none; width: 34px; height: 34px; border: none; background: none; cursor: pointer; }
  .site-tabs-toggle span { display: flex; flex-direction: column; gap: 5px; }
  .site-tabs-toggle i { display: block; width: 22px; height: 1.5px; background: var(--nav-fg-strong); }
  @media (max-width: 860px) { .site-tabs-toggle { display: block; } }

  /* ---------- the three image sections ---------- */
  .market-section { padding: clamp(28px, 4vw, 48px) 0; }
  .market-section:first-of-type { padding-top: clamp(28px, 4vw, 48px); }
  .market-section img {
    display: block; width: 100%; height: auto; border-radius: 16px;
    border: 1px solid var(--border);
  }

  footer { border-top: 1px solid var(--border); padding: 32px clamp(20px, 5vw, 64px); display: flex; align-items: center;
    justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-faint); }
  footer .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
  footer .footer-links a:hover { color: #FFFFFF; }
</style>
</head>
<body>

<header class="site-header">
  <a class="site-logo" href="/" aria-label="ROQ Home">
    <svg class="logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 70 L32 42 L50 25 Q74 40 67 70" />
    </svg>
  </a>
  <nav class="site-tabs" id="siteTabs" aria-label="Main">
    <a href="/build.html">Build</a>

    <a href="/move.html">Move</a>
    <a href="/understand.html">Understand</a>
    <a href="/market.html" class="active" aria-current="page">Market</a>
  </nav>
  <button class="site-tabs-toggle" id="siteTabsToggle" aria-controls="siteTabs" aria-expanded="false" aria-label="Menu"><span><i></i></span></button>
</header>

<main>
  <section class="market-section wrap">
    <img src="/assets/market/market-hero.webp" width="1672" height="941" loading="eager" decoding="async"
      alt="Understand the home market — current 30-year and 15-year mortgage rates, HELOC rate, home value trend, home insurance trend, contractor labor trend, material cost trend, and electricity trend">
  </section>

  <section class="market-section wrap">
    <img src="/assets/market/project-costs.webp" width="1672" height="941" loading="lazy" decoding="async"
      alt="Common project costs right now, estimated national ranges for roof replacement, HVAC replacement, water heater replacement, kitchen remodel, bathroom remodel, windows, flooring, deck, and fence">
  </section>

  <section class="market-section wrap">
    <img src="/assets/market/material-costs.webp" width="1672" height="941" loading="lazy" decoding="async"
      alt="Material cost trends year over year for lumber, concrete, steel, copper, drywall and gypsum, roofing materials, and fiberglass insulation">
  </section>
</main>

<footer>

    <a href="/">Home</a>
    <a href="/about.html">Story</a>

    <a href="/legal/roq-terms.html">Terms</a>
    <a href="mailto:support@roqhome.com">Contact</a>
  </div>
</footer>

<script>
  var toggle = document.getElementById('siteTabsToggle');
  var tabs = document.getElementById('siteTabs');
  if (toggle && tabs) {
    toggle.addEventListener('click', function () {
      var open = tabs.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
</script>
