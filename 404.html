<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — ROQ Home</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/roq-icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120E;
    --ink: #F5F1E9;
    --ink-dim: rgba(245,241,233,0.62);
    --line: rgba(245,241,233,0.14);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header { padding: 24px clamp(24px, 6vw, 72px); }

  .logo-mark {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: var(--ink);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px clamp(24px, 6vw, 72px) 80px;
    max-width: 760px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  h1 {
    margin-top: 14px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: clamp(34px, 5vw, 54px);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  p.lede {
    margin-top: 18px;
    max-width: 44ch;
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-dim);
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 36px;
  }

  nav a {
    display: inline-flex;
    align-items: center;
    min-height: 46px;
    padding: 0 22px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    font-size: 14px;
    text-decoration: none;
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease), color 0.25s var(--ease);
  }

  nav a:first-child { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  nav a:hover { border-color: rgba(245,241,233,0.5); }
  nav a:first-child:hover { background: #FFFFFF; }
  nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>

  <header>
    <a href="/" aria-label="ROQ Home">
      <svg class="logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 70 L32 42 L50 25 Q74 40 67 70" />
      </svg>
    </a>
  </header>

  <main>
    <p class="eyebrow">404</p>
    <h1>This page isn&rsquo;t here.</h1>
    <p class="lede">It may have moved when we reorganized the site. These will take you where you were headed.</p>
    <nav aria-label="Main pages">
      <a href="/">Home</a>
      <a href="/dream.html">Dream Home Plan</a>
      <a href="/renovate.html">Renovation Plan</a>
      <a href="/solutions.html">Solutions</a>
      <a href="/manage.html">The ROQ app</a>
      <a href="/faq.html">FAQ</a>
    </nav>
  </main>

</body>
</html>
