<style>
  :root {
    --bg: #171716;
    --bg-deep: #0D0D0C;
    --ink: #FFFFFF;
    --ink-dim: #A8A6A2;
    --ink-faint: #8C8A86;
    --gold: #C8A882;
    --border: rgba(255,255,255,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--gold); color: #14110B; }

  /* ---------- Site header ----------
     Self-contained: every value it needs is declared here, so the same
     block drops onto the dark pages and the light ones alike. Pages with
     a light background add class="on-light" to <header>. */

  .site-header {
    --nav-fg: rgba(255,255,255,0.78);
    --nav-fg-strong: #FFFFFF;
    --nav-accent: #C8A882;
    --nav-scrim: 13,13,12;
    --nav-solid: rgba(13,13,12,0.82);
    --nav-border: rgba(255,255,255,0.10);
    --nav-panel: rgba(10,10,9,0.96);
    --nav-shadow: 0 1px 12px rgba(0,0,0,0.55);
    --nav-ease: cubic-bezier(0.16, 1, 0.3, 1);

    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px clamp(24px, 5vw, 64px);
    border-bottom: 1px solid transparent;
    transition: background 0.35s var(--nav-ease), border-color 0.35s var(--nav-ease);
  }

  .site-header.on-light {
    --nav-fg: rgba(20,19,15,0.78);
    --nav-fg-strong: #14130F;
    --nav-accent: #A66F30;
    --nav-scrim: 255,255,255;
    --nav-solid: rgba(255,255,255,0.90);
    --nav-border: rgba(20,19,15,0.12);
    --nav-panel: rgba(255,255,255,0.98);
    --nav-shadow: none;
  }

  /* The tabs sit over whatever the hero is — a dusk sky, a night render, a
     cream panel. A top-down scrim keeps them legible on all of them, and
     fades out once the solid scrolled background takes over. */
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(var(--nav-scrim),0.80) 0%,
      rgba(var(--nav-scrim),0.42) 58%,
      rgba(var(--nav-scrim),0) 100%
    );
    transition: opacity 0.35s var(--nav-ease);
  }

  .site-header.scrolled::before { opacity: 0; }

  .site-header.scrolled {
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  /* Pages whose content starts below the header — rather than running under
     a floating one — hold their own space and keep a background at all times. */
  .site-header.inflow {
    position: sticky;
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  .site-header.inflow::before { display: none; }

  .site-logo { display: flex; }

  .logo-mark {
    width: 30px;
    height: 30px;
    display: block;
  }

  .logo-mark path {
    stroke: var(--nav-fg-strong);
    stroke-width: 8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .site-tabs {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.1vw, 30px);
  }

  .site-tabs a {
    position: relative;
    padding: 6px 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--nav-fg);
    text-shadow: var(--nav-shadow);
    transition: color 0.25s var(--nav-ease);
  }

  .site-tabs a:hover { color: var(--nav-fg-strong); }
  .site-tabs a.active { color: var(--nav-fg-strong); }

  .site-tabs a.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: var(--nav-accent);
  }

  .site-tabs-toggle { display: none; }

  @media (max-width: 760px) {
    .site-tabs-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--nav-border);
      border-radius: 50%;
      cursor: pointer;
    }

    .site-tabs-toggle span { position: relative; width: 16px; height: 10px; }

    .site-tabs-toggle span::before,
    .site-tabs-toggle span::after,
    .site-tabs-toggle span i {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--nav-fg-strong);
    }

    .site-tabs-toggle span::before { top: 0; }
    .site-tabs-toggle span i { top: 50%; margin-top: -0.5px; display: block; }
    .site-tabs-toggle span::after { bottom: 0; }

    .site-tabs {
      position: absolute;
      top: calc(100% - 4px);
      right: clamp(24px, 5vw, 64px);
      min-width: 170px;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: var(--nav-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--nav-border);
      border-radius: 14px;
      padding: 8px;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s var(--nav-ease), transform 0.25s var(--nav-ease);
    }

    .site-tabs.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .site-tabs a { padding: 12px 14px; border-radius: 8px; text-shadow: none; }
    .site-tabs a.active { background: rgba(127,127,127,0.14); }
    .site-tabs a.active::after { display: none; }
  }


  /* ---------- Statement band ---------- */

  .statement {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(110px, 14vh, 150px) clamp(24px, 6vw, 64px) clamp(80px, 10vh, 110px);
    background: #050505;
    overflow: hidden;
    isolation: isolate;
  }

  /* The poster is the loop's first frame: it paints immediately, and the
     video fades in over it once it is actually playing. */
  .statement-img,
  .statement-video {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
  }

  .statement-video {
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .statement-video.is-playing { opacity: 1; }

  /* Holds the type over footage that swings from a dark hallway to a white
     room — darker at the top for the tabs and at the base for the handoff
     to the next section, lighter through the middle so the scenes read. */
  .statement-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      /* a soft pool of shade directly behind the headline, so it holds over
         white paper and fine linework without darkening the whole frame */
      radial-gradient(ellipse 46% 26% at 50% 50%, rgba(5,5,5,0.42) 0%, rgba(5,5,5,0) 100%),
      linear-gradient(
        to bottom,
        rgba(5,5,5,0.58) 0%,
        rgba(5,5,5,0.36) 24%,
        rgba(5,5,5,0.38) 62%,
        rgba(5,5,5,0.66) 100%
      );
  }

  @media (max-aspect-ratio: 1/1) {
    .statement-scrim {
      background:
        radial-gradient(ellipse 80% 16% at 50% 50%, rgba(5,5,5,0.42) 0%, rgba(5,5,5,0) 100%),
        linear-gradient(
          to bottom,
          rgba(5,5,5,0.58) 0%,
          rgba(5,5,5,0.36) 24%,
          rgba(5,5,5,0.38) 62%,
          rgba(5,5,5,0.66) 100%
        );
    }
  }

  .statement-text {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(32px, 4.6vw, 58px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    max-width: 22ch;
    margin: 0 auto;
    text-wrap: balance;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 30px rgba(0,0,0,0.6);
  }


  /* ---------- Welcome home ----------
     Second screen: a darkened photo, the greeting, and the two ways in. */

  .homecta {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(88px, 12vh, 130px) clamp(24px, 6vw, 64px);
    background: #14120E;
    overflow: hidden;
    isolation: isolate;
  }

  .homecta-img {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 40%;
  }

  .homecta-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 60% 45% at 50% 50%, rgba(14,12,9,0.30) 0%, rgba(14,12,9,0) 100%),
      rgba(14,12,9,0.62);
  }

  .homecta-title {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(34px, 5.4vw, 68px);
    line-height: 1.08;
    letter-spacing: 0.09em;
    /* Tracking adds space after the last letter too; pull it back so the
       line stays optically centred. */
    margin-right: -0.09em;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 30px rgba(0,0,0,0.6);
  }

  .homecta-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-top: clamp(30px, 5vh, 46px);
  }

  .homecta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 0 34px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    background: var(--ink);
    color: #14110B;
    border: 1px solid var(--ink);
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
  }

  .homecta-btn:hover { background: var(--gold); border-color: var(--gold); }
  .homecta-btn:active { transform: scale(0.985); }

  .homecta-btn.is-ghost {
    background: rgba(255,255,255,0.06);
    color: #FFFFFF;
    border-color: rgba(255,255,255,0.7);
    backdrop-filter: blur(6px);
  }

  .homecta-btn.is-ghost:hover { background: #FFFFFF; border-color: #FFFFFF; color: #14110B; }

  @media (max-width: 640px) {
    .homecta-title { font-size: 34px; letter-spacing: 0.07em; margin-right: -0.07em; }
    .homecta-actions { flex-direction: column; width: 100%; max-width: 320px; gap: 12px; }
    .homecta-btn { width: 100%; }
  }

  /* ---------- Welcome ---------- */

  .welcome {
    position: relative;
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: clamp(72px, 11vh, 110px) clamp(24px, 6vw, 64px);
    background: #F7F6F2;
    overflow: hidden;
    isolation: isolate;
  }

  .welcome-img {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 22% 50%;
  }

  .welcome-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 38%),
      linear-gradient(to right, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.84) 32%, rgba(255,255,255,0.3) 58%, rgba(255,255,255,0) 74%);
  }

  .welcome-copy { max-width: 640px; }

  .welcome-lead {
    display: block;
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1.18;
    letter-spacing: -0.01em;
    color: #14130F;
    margin-bottom: 16px;
  }

  .welcome-text {
    font-family: 'Inter', sans-serif;
    font-size: clamp(15px, 1.7vw, 17px);
    line-height: 1.65;
    color: #5C594F;
    max-width: 48ch;
  }

  @media (max-width: 640px) {
    .welcome { min-height: 100vh; padding: 96px 24px 64px; }
    .welcome-img { object-position: 18% 42%; }
    .welcome-lead { font-size: 26px; }
  }


  /* ---------- Explore (bridge into Build / App / Invest) ---------- */

  .explore {
    background: var(--bg);
    padding: clamp(72px, 11vh, 110px) clamp(24px, 5vw, 64px) clamp(88px, 12vh, 120px);
  }

  .explore-intro { margin-bottom: clamp(36px, 5vw, 52px); }

  .explore-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .explore-headline {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.2;
    color: var(--ink);
    max-width: 20ch;
  }

  .explore-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .explore-card {
    position: relative;
    display: block;
    aspect-ratio: 4 / 5;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .explore-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s var(--ease);
  }

  .explore-card:hover img { transform: scale(1.04); }

  .explore-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(13,13,12,0.92) 0%, rgba(13,13,12,0.28) 46%, rgba(13,13,12,0.05) 70%);
  }

  .explore-card-body {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: clamp(18px, 2.4vw, 26px);
    z-index: 1;
  }

  .explore-card-eyebrow {
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .explore-card-title {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(20px, 2.4vw, 27px);
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .explore-card-sub {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-dim);
    max-width: 26ch;
  }

  .explore-card-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.28);
    margin-top: 16px;
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
  }

  .explore-card-arrow svg { width: 15px; height: 15px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .explore-card:hover .explore-card-arrow { background: var(--gold); border-color: var(--gold); }

  @media (max-width: 860px) {
    .explore-grid { grid-template-columns: 1fr; }
    .explore-card { aspect-ratio: 16 / 10; }
  }


  /* ---------- Answers ----------
     A light section breaks the rhythm of dark-on-dark and gives the FAQ
     content its own register — closer to a page than a poster. */

  .answers {
    --paper: #F5F1EA;
    --paper-ink: #17140F;
    --paper-ink-dim: #6B6458;
    --paper-line: rgba(23,20,15,0.10);
    background: var(--paper);
    color: var(--paper-ink);
    padding: clamp(72px, 11vh, 110px) clamp(24px, 5vw, 64px) clamp(88px, 12vh, 120px);
  }

  .answers-intro { margin-bottom: clamp(36px, 5vw, 52px); }

  .answers-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #8A5A24;
    margin-bottom: 16px;
  }

  .answers-headline {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.2;
    max-width: 20ch;

  .answers-grid {

  .answer-card {

    align-items: flex-start;

  .answer-card:hover { background: #EFE9DE; }

  .answer-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;

  .answer-link {

    gap: 6px;

    font-weight: 600;

  .answer-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s var(--ease); }
  .answer-card:hover .answer-link svg { transform: translateX(3px); }

  @media (max-width: 860px) {
    .answers-grid { grid-template-columns: 1fr; }
  }

  @media (min-width: 861px) and (max-width: 1180px) {
    .answers-grid { grid-template-columns: repeat(2, 1fr); }
  }


  /* ---------- App showcase ---------- */

  .app-showcase {

    padding: clamp(80px, 12vh, 120px) 0 clamp(80px, 11vh, 110px);

  .app-showcase-intro {

  /* ---------- Mobile refinements ----------
     The desktop clamp() minimums were still tuned for a wide viewport: a 38px
     serif headline fills a 375px line edge to edge, and vh-based section
     padding leaves large dead zones before any content appears. This steps the
     scale and the rhythm down, and brings touch targets up to 44px. */

  @media (max-width: 640px) {
    .site-header .site-header-row,
    .site-header { padding: 16px 20px; }

  @media (max-width: 640px) {

    .statement {

  <script>
    // ---------- Header: tabs + scroll scrim ----------
    (function initHeader() {
      const header = document.querySelector('.site-header');
      const tabs = document.getElementById('siteTabs');
      const toggle = document.getElementById('siteTabsToggle');

      if (toggle && tabs) {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = tabs.classList.toggle('open');
          toggle.setAttribute('aria-expanded', isOpen);
        });
        document.addEventListener('click', () => {
          tabs.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      }

      if (header) {
        const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 12);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
      }
    })();
  </script>

  <script>
    /* Hero loop: a portrait cut for tall screens, a landscape cut for wide
       ones. The source is chosen in JS so only one file is ever fetched. */
    (function () {
      var video = document.getElementById('statementVideo');
      if (!video) return;

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var conn = navigator.connection || {};
      if (reduce.matches || conn.saveData) return;   // poster only

      var portrait = window.matchMedia('(max-aspect-ratio: 1/1)');
      var current = null;

      function load() {
        var src = '/assets/hero/experience-home-' + (portrait.matches ? 'mobile' : 'desktop') + '.mp4';
        if (src === current) return;
        current = src;
        video.classList.remove('is-playing');
        video.muted = true;               // required for autoplay; set as a property for iOS
        video.src = src;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});   // autoplay refused: poster stays
      }

      video.addEventListener('playing', function () {
        video.classList.add('is-playing');
      });

      // Rotating a phone or tablet swaps cuts.
      if (portrait.addEventListener) portrait.addEventListener('change', load);

      // Don't decode frames nobody can see.
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          if (!current) return;
          if (entries[0].isIntersecting) {
            var p = video.play();
            if (p && p.catch) p.catch(function () {});
          } else {
            video.pause();
          }
        }).observe(video);
      }

      load();
    })();
  </script>
