<style>
  :root {
    --bg: #171716;
    --bg-deep: #0D0D0C;
    --ink: #FFFFFF;
    --ink-dim: #A8A6A2;
    --ink-faint: #6B6966;
    --gold: #C8A882;
    --border: rgba(255,255,255,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--gold); color: #14110B; }

  /* ---------- Header ---------- */

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px clamp(24px, 5vw, 64px);
    mix-blend-mode: normal;
  }

  .logo-mark {
    width: 30px;
    height: 30px;
    display: block;
  }

  .logo-mark path {
    stroke: var(--ink);
    stroke-width: 8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-wrap {
    position: relative;
  }

  .nav-trigger {
    width: 40px;
    height: 40px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s var(--ease);
  }

  .nav-trigger:hover,
  .nav-trigger[aria-expanded="true"] {
    border-color: rgba(255,255,255,0.3);
  }

  .nav-trigger span {
    position: relative;
    width: 16px;
    height: 10px;
  }

  .nav-trigger span::before,
  .nav-trigger span::after,
  .nav-trigger span i {
    content: '';
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;
    background: var(--ink-dim);
    transition: background 0.3s var(--ease);
  }

  .nav-trigger span::before { top: 0; }
  .nav-trigger span i { top: 50%; margin-top: -0.5px; display: block; }
  .nav-trigger span::after { bottom: 0; }

  .nav-trigger:hover span::before,
  .nav-trigger:hover span::after,
  .nav-trigger:hover span i {
    background: var(--ink);
  }

  .nav-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: rgba(10,14,20,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
  }

  .nav-menu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .nav-menu a {
    display: block;
    padding: 12px 14px;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    border-radius: 8px;
    transition: background 0.2s var(--ease), color 0.2s var(--ease);
  }

  .nav-menu a:hover,
  .nav-menu a.active {
    background: rgba(255,255,255,0.06);
    color: var(--ink);
  }

  /* ---------- Close / CTA ---------- */

  .close {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px clamp(24px, 6vw, 64px);
    background: var(--bg-deep);
  }

  .close-orb-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
  }

  .close-orb {
    width: clamp(72px, 9vw, 96px);
    height: clamp(72px, 9vw, 96px);
    filter: drop-shadow(0 0 24px rgba(255,255,255,0.22));
  }

  .close-headline {
    font-family: 'Lora', serif;
    font-size: clamp(28px, 3.8vw, 46px);
    color: var(--ink);
    margin-bottom: 0;
    max-width: 20ch;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s var(--ease) 0.1s, transform 0.9s var(--ease) 0.1s;
  }

  .close-orb-wrap.in-view,
  .close-headline.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Intro / choice ---------- */

  .intro {
    background: #FFFFFF;
    color: #1C1C1A;
    padding: clamp(90px, 14vh, 140px) clamp(24px, 6vw, 64px);
    text-align: center;
  }

  .intro-text {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 2.8vw, 32px);
    line-height: 1.4;
    max-width: 32ch;
    margin: 0 auto clamp(56px, 8vw, 80px);
    color: #0B0B0A;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
  }

  .intro-text.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  .intro-choices {
    display: flex;
    justify-content: center;
    gap: clamp(20px, 3vw, 32px);
    max-width: 720px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  .intro-choice {
    flex: 1 1 260px;
    max-width: 320px;
    display: block;
    padding: clamp(36px, 5vw, 48px) 28px;
    border: 1px solid rgba(28,28,26,0.14);
    border-radius: 18px;
    color: #1C1C1A;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease),
      border-color 0.25s var(--ease), background 0.25s var(--ease);
  }

  .intro-choice.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  .intro-choice:hover {
    border-color: var(--gold);
    background: rgba(200,168,130,0.06);
  }

  .intro-choice-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.01em;
  }

  /* ---------- Footer ---------- */

  footer {
    background: var(--bg-deep);
    padding: 48px clamp(24px, 5vw, 64px) 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .footer-left .logo-mark { width: 20px; height: 20px; opacity: 0.7; }
  .footer-left .logo-mark path { stroke: var(--ink-dim); }

  .footer-copy {
    font-size: 12px;
    color: var(--ink-faint);
  }

  .footer-links {
    display: flex;
    gap: 28px;
  }

  .footer-links a {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    transition: color 0.2s var(--ease);
  }

  .footer-links a:hover { color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce) {
    .close-orb-wrap, .close-headline, .intro-text, .intro-choice {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>

<body>

  <script>
    // ---------- Nav dropdown ----------
    const navTrigger = document.getElementById('navTrigger');
    const navMenu = document.getElementById('navMenu');

    navTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = navMenu.classList.toggle('open');
      navTrigger.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', () => {
      navMenu.classList.remove('open');
      navTrigger.setAttribute('aria-expanded', 'false');
    });

    // ---------- Scroll reveal ----------
    const revealEls = [
      document.getElementById('closeOrbWrap'),
      document.getElementById('closeHeadline'),
      document.getElementById('introText'),
      document.getElementById('introChoiceHome'),
      document.getElementById('introChoiceBusiness'),
    ];

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
        }
      });
    }, { threshold: 0.4 });

    revealEls.forEach(el => el && observer.observe(el));

    // ---------- SLADE orb ----------
    // A small "living" particle sphere — same visual language as the SLADE
    // mark elsewhere in the app: a breathing, slowly rotating cluster of
    // shimmering white points rather than a static icon.
    (function initSladeOrb() {
      const canvas = document.getElementById('closeOrb');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const size = canvas.width;
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      ctx.scale(dpr, dpr);

      const center = size / 2;
      const radius = size * 0.46;
      const count = Math.round(24 + size * 0.9);

      const particles = [];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.pow(Math.random(), 0.55) * radius;
        particles.push({
          x: Math.cos(angle) * r,
          y: Math.sin(angle) * r,
          size: Math.random() * 1.6 + 0.7,
          phase: Math.random() * Math.PI * 2,
          speed: 0.0007 + Math.random() * 0.0012,
          minOpacity: 0.35,
          maxOpacity: 1,
        });
      }

      const breatheDuration = 3200; // ms, half-cycle
      const rotateDuration = 26000; // ms, full rotation
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function frame(t) {
        ctx.clearRect(0, 0, size, size);

        const breatheT = (t % (breatheDuration * 2)) / (breatheDuration * 2);
        const breathe = (Math.sin(breatheT * Math.PI * 2 - Math.PI / 2) + 1) / 2;
        const scale = 0.94 + breathe * (1.06 - 0.94);

        const rotateT = (t % rotateDuration) / rotateDuration;
        const rotation = rotateT * Math.PI * 2;

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);

        particles.forEach((p) => {
          const shimmer = (Math.sin(t * p.speed + p.phase) + 1) / 2;
          const opacity = p.minOpacity + shimmer * (p.maxOpacity - p.minOpacity);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${opacity})`;
          ctx.fill();
        });

        ctx.restore();
        if (!reduceMotion) requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>

</body>
