<style>
  :root {
    --bg: #171716;
    --bg-deep: #0D0D0C;
    --ink: #FFFFFF;
    --ink-dim: #A8A6A2;
    --ink-faint: #8C8A86;
    --gold: #C8A882;
    --border: rgba(255,255,255,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--gold); color: #14110B; }

  /* ---------- Site header ----------
     Self-contained: every value it needs is declared here, so the same
     block drops onto the dark pages and the light ones alike. Pages with
     a light background add class="on-light" to <header>. */

  .site-header {
    --nav-fg: rgba(255,255,255,0.78);
    --nav-fg-strong: #FFFFFF;
    --nav-accent: #C8A882;
    --nav-scrim: 13,13,12;
    --nav-solid: rgba(13,13,12,0.82);
    --nav-border: rgba(255,255,255,0.10);
    --nav-panel: rgba(10,10,9,0.96);
    --nav-shadow: 0 1px 12px rgba(0,0,0,0.55);
    --nav-ease: cubic-bezier(0.16, 1, 0.3, 1);

    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px clamp(24px, 5vw, 64px);
    border-bottom: 1px solid transparent;
    transition: background 0.35s var(--nav-ease), border-color 0.35s var(--nav-ease);
  }

  .site-header.on-light {
    --nav-fg: rgba(20,19,15,0.78);
    --nav-fg-strong: #14130F;
    --nav-accent: #A66F30;
    --nav-scrim: 255,255,255;
    --nav-solid: rgba(255,255,255,0.90);
    --nav-border: rgba(20,19,15,0.12);
    --nav-panel: rgba(255,255,255,0.98);
    --nav-shadow: none;
  }

  /* The tabs sit over whatever the hero is — a dusk sky, a night render, a
     cream panel. A top-down scrim keeps them legible on all of them, and
     fades out once the solid scrolled background takes over. */
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(var(--nav-scrim),0.80) 0%,
      rgba(var(--nav-scrim),0.42) 58%,
      rgba(var(--nav-scrim),0) 100%
    );
    transition: opacity 0.35s var(--nav-ease);
  }

  .site-header.scrolled::before { opacity: 0; }

  .site-header.scrolled {
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  /* Pages whose content starts below the header — rather than running under
     a floating one — hold their own space and keep a background at all times. */
  .site-header.inflow {
    position: sticky;
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  .site-header.inflow::before { display: none; }

  .site-logo { display: flex; }

  .logo-mark {
    width: 30px;
    height: 30px;
    display: block;
  }

  .logo-mark path {
    stroke: var(--nav-fg-strong);
    stroke-width: 8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .site-tabs {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.1vw, 30px);
  }

  .site-tabs a {
    position: relative;
    padding: 6px 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--nav-fg);
    text-shadow: var(--nav-shadow);
    transition: color 0.25s var(--nav-ease);
  }

  .site-tabs a:hover { color: var(--nav-fg-strong); }
  .site-tabs a.active { color: var(--nav-fg-strong); }

  .site-tabs a.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: var(--nav-accent);
  }

  .site-tabs-toggle { display: none; }

  @media (max-width: 760px) {
    .site-tabs-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--nav-border);
      border-radius: 50%;
      cursor: pointer;
    }

    .site-tabs-toggle span { position: relative; width: 16px; height: 10px; }

    .site-tabs-toggle span::before,
    .site-tabs-toggle span::after,
    .site-tabs-toggle span i {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--nav-fg-strong);
    }

    .site-tabs-toggle span::before { top: 0; }
    .site-tabs-toggle span i { top: 50%; margin-top: -0.5px; display: block; }
    .site-tabs-toggle span::after { bottom: 0; }

    .site-tabs {
      position: absolute;
      top: calc(100% - 4px);
      right: clamp(24px, 5vw, 64px);
      min-width: 170px;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: var(--nav-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--nav-border);
      border-radius: 14px;
      padding: 8px;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s var(--nav-ease), transform 0.25s var(--nav-ease);
    }

    .site-tabs.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .site-tabs a { padding: 12px 14px; border-radius: 8px; text-shadow: none; }
    .site-tabs a.active { background: rgba(127,127,127,0.14); }
    .site-tabs a.active::after { display: none; }
  }


  /* ---------- Statement band ---------- */

  .statement {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(110px, 14vh, 150px) clamp(24px, 6vw, 64px) clamp(80px, 10vh, 110px);
    background: #050505;
    overflow: hidden;
    isolation: isolate;
  }

  /* The poster is the loop's first frame: it paints immediately, and the
     video fades in over it once it is actually playing. */
  .statement-img,
  .statement-video {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
  }

  .statement-video {
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .statement-video.is-playing { opacity: 1; }

  /* Holds the type over footage that swings from a dark hallway to a white
     room — darker at the top for the tabs and at the base for the handoff
     to the next section, lighter through the middle so the scenes read. */
  .statement-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      /* a soft pool of shade directly behind the headline, so it holds over
         white paper and fine linework without darkening the whole frame */
      radial-gradient(ellipse 46% 26% at 50% 50%, rgba(5,5,5,0.42) 0%, rgba(5,5,5,0) 100%),
      linear-gradient(
        to bottom,
        rgba(5,5,5,0.58) 0%,
        rgba(5,5,5,0.36) 24%,
        rgba(5,5,5,0.38) 62%,
        rgba(5,5,5,0.66) 100%
      );
  }

  @media (max-aspect-ratio: 1/1) {
    .statement-scrim {
      background:
        radial-gradient(ellipse 80% 16% at 50% 50%, rgba(5,5,5,0.42) 0%, rgba(5,5,5,0) 100%),
        linear-gradient(
          to bottom,
          rgba(5,5,5,0.58) 0%,
          rgba(5,5,5,0.36) 24%,
          rgba(5,5,5,0.38) 62%,
          rgba(5,5,5,0.66) 100%
        );
    }
  }

  .statement-text {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(32px, 4.6vw, 58px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    max-width: 22ch;
    margin: 0 auto;
    text-wrap: balance;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 30px rgba(0,0,0,0.6);
  }


  /* ---------- App hero ----------
     The App page's screen, on the home page after Atmospheres. A portrait photo. On wide screens it is shown whole and sharp in the
     centre, over a blurred, darkened copy of itself that fills the sides;
     on tall screens it fills the screen edge to edge. The App Store button
     holds the bottom of the screen either way. */

  .app-hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #0B0B0A;
    padding: 84px 24px clamp(28px, 5vh, 48px);
    overflow: hidden;
    isolation: isolate;
  }

  .app-hero::before {
    content: "";
    position: absolute;
    inset: -60px;
    z-index: -1;
    background: url(/assets/hero/app-promo.webp) 50% 50% / cover no-repeat;
    filter: blur(36px) brightness(0.42);
  }

  /* Read by screen readers and search engines; the photo carries it visually. */
  .app-hero-title {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .app-hero picture {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
  }

  .app-hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .app-hero .appstore-btn { flex: none; margin-top: clamp(16px, 3vh, 28px); }

  @media (max-aspect-ratio: 1/1) {
    .app-hero::before { display: none; }
    .app-hero { justify-content: flex-end; }
    .app-hero picture { position: absolute; inset: 0; z-index: -1; }
    .app-hero-img { object-fit: cover; object-position: 50% 50%; }
    .app-hero .appstore-btn { box-shadow: 0 10px 40px rgba(0,0,0,0.45); }
  }

  /* ---------- Page sections ----------
     The Build, Renovate and Connect screens, as they appear on their own
     pages. Those pages use a warmer gold and a light form palette than this
     one, so both are restated here for just these blocks. */

  .pagehero { --gold: #C2873F; }

  .modal-overlay {
    --bg-soft: #F2EEE4;
    --ink: #1C1B18;
    --ink-dim: #5B5A54;
    --ink-faint: #948F83;
    --border: rgba(28,27,24,0.10);
    --gold: #C2873F;
    --gold-dark: #A66F30;
    --danger: #B5473A;
  }

  .pagehero {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px clamp(24px, 6vw, 64px) 96px;
    background: #14120E;
    overflow: hidden;
    isolation: isolate;
  }

  /* The poster is the loop's first frame: it paints immediately, and the
     video fades in over it once it is actually playing. */
  .pagehero-img,
  .pagehero-video {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
  }

  .pagehero-video {
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .pagehero-video.is-playing { opacity: 1; }

  /* Holds the type over footage that runs from pale lumber to white paper —
     darker at the top for the tabs and at the base, lighter through the
     middle, with a soft pool of shade directly behind the headline. */
  .pagehero-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 46% 26% at 50% 50%, rgba(20,18,14,0.42) 0%, rgba(20,18,14,0) 100%),
      linear-gradient(
        to bottom,
        rgba(20,18,14,0.58) 0%,
        rgba(20,18,14,0.36) 24%,
        rgba(20,18,14,0.38) 62%,
        rgba(20,18,14,0.66) 100%
      );
  }

  @media (max-aspect-ratio: 1/1) {
    .pagehero-scrim {
      background:
        radial-gradient(ellipse 80% 18% at 50% 50%, rgba(20,18,14,0.42) 0%, rgba(20,18,14,0) 100%),
        linear-gradient(
          to bottom,
          rgba(20,18,14,0.58) 0%,
          rgba(20,18,14,0.36) 24%,
          rgba(20,18,14,0.38) 62%,
          rgba(20,18,14,0.66) 100%
        );
    }
  }

  /* The Build photo is mostly white paper, so it takes an extra even layer of shade. */
  .pagehero--bright .pagehero-scrim::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(20,18,14,0.30);
  }

  .pagehero-headline {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(32px, 4.6vw, 58px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: #FFFFFF;
    max-width: 24ch;
    margin: 0 auto;
    text-wrap: balance;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 2px 30px rgba(0,0,0,0.6);
  }

  /* What each offer includes, set under the headline. */
  .pagehero-body { width: 100%; max-width: 760px; }

  .pagehero-points {
    list-style: none;
    display: grid;
    grid-template-columns: auto;
    justify-content: center;
    gap: 12px;
    margin: clamp(26px, 4.4vh, 40px) auto 0;
    text-align: left;
  }

  .pagehero-points li {
    position: relative;
    padding-left: 20px;
    font-size: clamp(15px, 1.25vw, 17px);
    line-height: 1.4;
    color: rgba(255,255,255,0.94);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 18px rgba(0,0,0,0.55);
  }

  .pagehero-points li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.62em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #FFFFFF;
  }

  .pagehero-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    margin-top: clamp(30px, 5vh, 44px);
    padding: 0 38px;
    border-radius: 999px;
    border: 1px solid #FFFFFF;
    background: #FFFFFF;
    color: #14110B;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease), color 0.25s var(--ease), transform 0.25s var(--ease);
  }

  .pagehero-cta:hover { background: var(--gold); border-color: var(--gold); color: #FFFFFF; }
  .pagehero-cta:active { transform: scale(0.985); }

  @media (max-width: 640px) {
    .pagehero { padding: 104px 24px 84px; }
    .pagehero-headline { font-size: 31px; max-width: 14ch; }
    .pagehero-points { gap: 11px; }
    .pagehero-points li { font-size: 15px; }
    .pagehero-cta { width: 100%; max-width: 320px; }
  }

  /* ---------- Intake forms ---------- */

  .modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(20,19,15,0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; opacity: 0; visibility: hidden;
    transition: opacity 0.3s var(--ease), visibility 0.3s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }

  .modal-panel {
    background: #fff; color: var(--ink); border-radius: 4px; width: 100%; max-width: 500px;
    max-height: 88vh; overflow-y: auto; padding: clamp(28px, 5vw, 44px);
    position: relative; transform: translateY(14px);
    transition: transform 0.3s var(--ease);
  }
  .modal-overlay.open .modal-panel { transform: translateY(0); }

  .modal-close {
    position: absolute; top: 18px; right: 18px; width: 32px; height: 32px;
    border-radius: 50%; border: 1px solid var(--border); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); font-size: 15px; line-height: 1;
  }
  .modal-close:hover { background: var(--bg-soft); color: var(--ink); }

  .modal-title { font-family: 'Lora', serif; font-weight: 500; font-size: clamp(21px, 3vw, 25px); line-height: 1.3; margin-bottom: 24px; padding-right: 30px; }

  .q-block { margin-bottom: 22px; }
  .q-label { display: block; font-family: 'Lora', serif; font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--ink); margin-bottom: 10px; }
  .q-label small { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; color: var(--ink-faint); }

  .q-options { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }

  .q-option {
    min-height: 44px; padding: 0 18px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--ink);
    font-family: inherit; font-size: 14.5px; cursor: pointer;
    transition: background 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease);
  }
  .q-option:hover { border-color: var(--gold); }
  .q-option[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .q-input {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 16px; color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 16px; outline: none;
  }

  <script>
    // ---------- Header: tabs + scroll scrim ----------
    (function initHeader() {
      const header = document.querySelector('.site-header');
      const tabs = document.getElementById('siteTabs');
      const toggle = document.getElementById('siteTabsToggle');

      if (toggle && tabs) {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = tabs.classList.toggle('open');
          toggle.setAttribute('aria-expanded', isOpen);
        });
        document.addEventListener('click', () => {
          tabs.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      }

      if (header) {
        const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 12);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
      }
    })();
  </script>

  <script>
    /* Hero loop: a portrait cut for tall screens, a landscape cut for wide
       ones. The source is chosen in JS so only one file is ever fetched. */
    (function () {
      var video = document.getElementById('statementVideo');
      if (!video) return;

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var conn = navigator.connection || {};
      if (reduce.matches || conn.saveData) return;   // poster only

      var portrait = window.matchMedia('(max-aspect-ratio: 1/1)');
      var current = null;

      function load() {
        var src = '/assets/hero/experience-home-' + (portrait.matches ? 'mobile' : 'desktop') + '.mp4';
        if (src === current) return;
        current = src;
        video.classList.remove('is-playing');
        video.muted = true;               // required for autoplay; set as a property for iOS
        video.src = src;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});   // autoplay refused: poster stays
      }

      video.addEventListener('playing', function () {
        video.classList.add('is-playing');
      });

      // Rotating a phone or tablet swaps cuts.
      if (portrait.addEventListener) portrait.addEventListener('change', load);

      // Don't decode frames nobody can see.
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          if (!current) return;
          if (entries[0].isIntersecting) {
            var p = video.play();
            if (p && p.catch) p.catch(function () {});
          } else {
            video.pause();
          }
        }).observe(video);
      }

      load();
    })();
  </script>

  <script>
    /* Atmospheres loop: same portrait/landscape cuts as the Atmospheres page. It sits
       below the fold, so nothing is fetched until it is nearly on screen. */
    (function () {
      var video = document.getElementById('atmospheresVideo');
      if (!video) return;

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var conn = navigator.connection || {};
      if (reduce.matches || conn.saveData) return;   // poster only

      var portrait = window.matchMedia('(max-aspect-ratio: 1/1)');
      var current = null;

      function load() {
        var src = '/assets/hero/atmospheres-loop-' + (portrait.matches ? 'mobile' : 'desktop') + '.mp4?v=2';
        if (src === current) return;
        current = src;
        video.classList.remove('is-playing');
        video.muted = true;               // required for autoplay; set as a property for iOS
        video.src = src;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});   // autoplay refused: poster stays
      }

      video.addEventListener('playing', function () {
        video.classList.add('is-playing');
      });

      // Rotating a phone or tablet swaps cuts, once a cut has been loaded.
      if (portrait.addEventListener) portrait.addEventListener('change', function () {
        if (current) load();
      });

      if (!('IntersectionObserver' in window)) { load(); return; }

      // Load when it comes near the viewport; pause while it is off screen.
      new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) { video.pause(); return; }
        if (!current) { load(); return; }
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      }, { rootMargin: '400px 0px' }).observe(video);
    })();
  </script>
