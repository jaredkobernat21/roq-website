<style>
  :root {
    --bg: #171716;
    --bg-deep: #0D0D0C;
    --ink: #FFFFFF;
    --ink-dim: #A8A6A2;
    --ink-faint: #6B6966;
    --gold: #C8A882;
    --border: rgba(255,255,255,0.08);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--gold); color: #14110B; }

  /* ---------- Site header ----------
     Self-contained: every value it needs is declared here, so the same
     block drops onto the dark pages and the light ones alike. Pages with
     a light background add class="on-light" to <header>. */

  .site-header {
    --nav-fg: rgba(255,255,255,0.58);
    --nav-fg-strong: #FFFFFF;
    --nav-accent: #C8A882;
    --nav-scrim: 13,13,12;
    --nav-solid: rgba(13,13,12,0.82);
    --nav-border: rgba(255,255,255,0.10);
    --nav-panel: rgba(10,10,9,0.96);
    --nav-shadow: 0 1px 12px rgba(0,0,0,0.55);
    --nav-ease: cubic-bezier(0.16, 1, 0.3, 1);

    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 22px clamp(24px, 5vw, 64px);
    border-bottom: 1px solid transparent;
    transition: background 0.35s var(--nav-ease), border-color 0.35s var(--nav-ease);
  }

  .site-header.on-light {
    --nav-fg: rgba(20,19,15,0.58);
    --nav-fg-strong: #14130F;
    --nav-accent: #A66F30;
    --nav-scrim: 255,255,255;
    --nav-solid: rgba(255,255,255,0.90);
    --nav-border: rgba(20,19,15,0.12);
    --nav-panel: rgba(255,255,255,0.98);
    --nav-shadow: none;
  }

  /* The tabs sit over whatever the hero is — a dusk sky, a night render, a
     cream panel. A top-down scrim keeps them legible on all of them, and
     fades out once the solid scrolled background takes over. */
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(var(--nav-scrim),0.80) 0%,
      rgba(var(--nav-scrim),0.42) 58%,
      rgba(var(--nav-scrim),0) 100%
    );
    transition: opacity 0.35s var(--nav-ease);
  }

  .site-header.scrolled::before { opacity: 0; }

  .site-header.scrolled {
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  /* Pages whose content starts below the header — rather than running under
     a floating one — hold their own space and keep a background at all times. */
  .site-header.inflow {
    position: sticky;
    background: var(--nav-solid);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom-color: var(--nav-border);
  }

  .site-header.inflow::before { display: none; }

  .site-logo { display: flex; }

  .logo-mark {
    width: 30px;
    height: 30px;
    display: block;
  }

  .logo-mark path {
    stroke: var(--nav-fg-strong);
    stroke-width: 8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .site-tabs {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.1vw, 30px);
  }

  .site-tabs a {
    position: relative;
    padding: 6px 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--nav-fg);
    text-shadow: var(--nav-shadow);
    transition: color 0.25s var(--nav-ease);
  }

  .site-tabs a:hover { color: var(--nav-fg-strong); }
  .site-tabs a.active { color: var(--nav-fg-strong); }

  .site-tabs a.active::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: var(--nav-accent);
  }

  .site-tabs-toggle { display: none; }

  @media (max-width: 760px) {
    .site-tabs-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--nav-border);
      border-radius: 50%;
      cursor: pointer;
    }

    .site-tabs-toggle span { position: relative; width: 16px; height: 10px; }

    .site-tabs-toggle span::before,
    .site-tabs-toggle span::after,
    .site-tabs-toggle span i {
      content: '';
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--nav-fg-strong);
    }

    .site-tabs-toggle span::before { top: 0; }
    .site-tabs-toggle span i { top: 50%; margin-top: -0.5px; display: block; }
    .site-tabs-toggle span::after { bottom: 0; }

    .site-tabs {
      position: absolute;
      top: calc(100% - 4px);
      right: clamp(24px, 5vw, 64px);
      min-width: 170px;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      background: var(--nav-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--nav-border);
      border-radius: 14px;
      padding: 8px;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s var(--nav-ease), transform 0.25s var(--nav-ease);
    }

    .site-tabs.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .site-tabs a { padding: 12px 14px; border-radius: 8px; text-shadow: none; }
    .site-tabs a.active { background: rgba(127,127,127,0.14); }
    .site-tabs a.active::after { display: none; }
  }


  /* ---------- Page hero ---------- */

  .pagehero {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px clamp(24px, 6vw, 64px) 96px;
    background: #14120E;
    overflow: hidden;
    isolation: isolate;
  }

  .pagehero-img {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .pagehero-scrim {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
      to bottom,
      rgba(18,16,13,0.62) 0%,
      rgba(18,16,13,0.34) 30%,
      rgba(18,16,13,0.54) 60%,
      rgba(18,16,13,0.86) 100%
    );
  }

  .pagehero-headline {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: clamp(32px, 4.6vw, 58px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: #FFFFFF;
    max-width: 17ch;
    margin: 0 auto;
    text-wrap: balance;
    text-shadow: 0 2px 30px rgba(0,0,0,0.55);
  }

  @media (max-width: 640px) {
    .pagehero { padding: 104px 24px 84px; }
    .pagehero-headline { font-size: 31px; max-width: 14ch; }
  }

  /* ---------- Waitlist ---------- */

  .beta-note {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(72px, 11vh, 110px) clamp(24px, 6vw, 64px);
    background: var(--bg-deep);
    border-top: 1px solid var(--border);
  }

  .beta-headline {
    font-family: 'Lora', serif;
    font-size: clamp(24px, 3vw, 34px);
    margin-bottom: 16px;
  }

  .close-sub {
    font-size: 15px;
    color: var(--ink-dim);
    max-width: 42ch;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* ---------- App Store CTA ---------- */

  .appstore-btn {
    display: inline-flex;
    align-items: center;
    gap: 15px;
    /* Slightly more room on the right than the left: the mark is optically
       heavier than the text edge, so symmetric padding reads off-centre. */
    padding: 17px 36px 17px 30px;
    border-radius: 999px;
    background: var(--ink);
    color: #14110B;
    border: 1px solid var(--ink);
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease);
  }

  .appstore-btn:hover { background: var(--gold); border-color: var(--gold); }
  .appstore-btn:active { transform: scale(0.985); }

  .appstore-btn svg {
    width: 27px;
    height: 27px;
    flex: none;
    fill: currentColor;
    /* the glyph's mass sits low; nudge it onto the type's optical centre */
    margin-top: -2px;
  }

  .appstore-btn-label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
    text-align: left;
  }

  .appstore-btn-label small {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    opacity: 0.58;
    margin-bottom: 4px;
  }

  .appstore-btn-label b {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .appstore-meta {
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  /* ---------- Footer ---------- */

  footer {
    background: var(--bg-deep);
    padding: 48px clamp(24px, 5vw, 64px) 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    border-top: 1px solid var(--border);
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .footer-left .logo-mark { width: 20px; height: 20px; opacity: 0.7; }
  .footer-left .logo-mark path { stroke: var(--ink-dim); }

  .footer-copy { font-size: 12px; color: var(--ink-faint); }

  .footer-links { display: flex; gap: 28px; flex-wrap: wrap; }

  .footer-links a {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    transition: color 0.2s var(--ease);
  }

  .footer-links a:hover { color: var(--ink-dim); }

  @media (prefers-reduced-motion: reduce) {
    .feature {
      transition: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  /* ---------- Mobile refinements ----------
     The desktop clamp() minimums were still tuned for a wide viewport: a 38px
     serif headline fills a 375px line edge to edge, and vh-based section
     padding leaves large dead zones before any content appears. This steps the
     scale and the rhythm down, and brings touch targets up to 44px. */

  @media (max-width: 640px) {
    .site-header .site-header-row,
    .site-header { padding: 16px 20px; }

    .site-tabs { min-width: 200px; padding: 10px; }

    /* 44px minimum so the menu is comfortable to hit one-handed */
    .site-tabs a {
      display: flex;
      align-items: center;
      min-height: 46px;
      padding: 0 14px;
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .site-tabs-toggle { width: 44px; height: 44px; }

    footer {
      padding: 36px 20px 32px;
      flex-direction: column;
      align-items: flex-start;
      gap: 22px;
    }

    .footer-links {
      gap: 0;
      width: 100%;
      flex-direction: column;
    }

    .footer-links a {
      display: flex;
      align-items: center;
      min-height: 44px;
      font-size: 13px;
      border-bottom: 1px solid var(--border, rgba(127,127,127,0.12));
    }

    .footer-links a:last-child { border-bottom: none; }
  }

</style>
</head>
<body>

  <header class="site-header">
    <a class="site-logo" href="/" aria-label="ROQ Home">

        <path d="M32 70 L32 42 L50 25 Q74 40 67 70" />
      </svg>
    </a>

    <nav class="site-tabs" id="siteTabs" aria-label="Main">
      <a href="/build.html">Build</a>

      <a href="/renovate.html">Improve</a>
      <a href="/move.html">Move</a>
      <a href="/understand.html">Understand</a>
    </nav>

    <button class="site-tabs-toggle" id="siteTabsToggle" aria-controls="siteTabs"
            aria-expanded="false" aria-label="Menu"><span><i></i></span></button>
  </header>


  <section class="pagehero">
    <img class="pagehero-img" src="/assets/hero/experience-hero.jpg" alt="A family together at a dinner table in a warmly lit home at sunset" style="object-position: 50% 45%" />
    <div class="pagehero-scrim"></div>

  </section>

  <section class="beta-note">
    <h2 class="beta-headline">ROQ Home is here.</h2>
    <p class="close-sub">Spend less time running your home and more time enjoying it.</p>
    <a class="appstore-btn" href="https://apps.apple.com/app/id6789206534" target="_blank" rel="noopener">
      <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="appstore-btn-label"><small>Download on the</small><b>App Store</b></span>
    </a>
    <p class="appstore-meta">Free on iPhone &middot; Requires iOS 15.1 or later</p>
  </section>

  <footer>
    <div class="footer-left">
      <svg class="logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 70 L32 42 L50 25 Q74 40 67 70" />
      </svg>
      <span class="footer-copy">&copy; 2026 ROQ Innovation LLC</span>
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="https://roqbusiness.com">ROQ Business</a>
      <a href="/about.html">Story</a>
      <a href="/legal/roq-privacy.html">Privacy</a>
      <a href="/legal/roq-terms.html">Terms</a>
      <a href="mailto:support@roqhome.com">Contact</a>
    </div>
  </footer>


  <script>
    // ---------- Header: tabs + scroll scrim ----------
    (function initHeader() {
      const header = document.querySelector('.site-header');
      const tabs = document.getElementById('siteTabs');
      const toggle = document.getElementById('siteTabsToggle');

      if (toggle && tabs) {
        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = tabs.classList.toggle('open');
          toggle.setAttribute('aria-expanded', isOpen);
        });
        document.addEventListener('click', () => {
          tabs.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      }

      if (header) {
        // The page opens on a full-height render, so the header keeps its
        // transparent treatment until the hero has passed under it.
        const hero = document.querySelector('.pagehero');
        const threshold = () =>
          hero ? Math.max(12, hero.offsetHeight - header.offsetHeight) : 12;

        const onScroll = () => header.classList.toggle('scrolled', window.scrollY > threshold());
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll, { passive: true });
      }
    })();

  </script>

</body>
